<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrio Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🥗 Nutrio Premium</h1>

        <div class="card">
            <h2>Ajouter un aliment</h2>

            <label for="aliment">Aliment</label>
            <select id="aliment"></select>

            <label for="grammes">Quantité (g)</label>
            <input type="number" id="grammes" placeholder="Ex : 150">

            <button onclick="calculerCalories()">
                Calculer
            </button>

            <p id="resultat"></p>
        </div>

        <div class="card">
            <h2>Objectif journalier</h2>
            <p>🎯 2300 kcal</p>
        </div>

        <div class="card">
            <h2>Aliments inclus</h2>
            <ul>
                <li>Poulet</li>
                <li>Riz cuit</li>
                <li>Pâtes cuites</li>
                <li>Banane</li>
                <li>Fromage blanc 0%</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
