<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="Nutrio Premium - suivi nutritionnel"><title>Nutrio Premium</title>
<style>
:root{--bg:#0b1020;--card:#151d31;--card2:#1c2740;--text:#f5f7fb;--muted:#9aa7bd;--accent:#6ee7b7;--blue:#60a5fa;--danger:#fb7185;--line:#2a3550}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0b1020,#111827 55%,#0b1020);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}header{padding:22px 18px 12px;position:sticky;top:0;background:#0b1020ee;backdrop-filter:blur(12px);z-index:5}h1{margin:0;font-size:27px}.sub{color:var(--muted);font-size:13px;margin-top:3px}main{max-width:760px;margin:auto;padding:12px 14px 100px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#151d31f5;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 8px 30px #0003;margin-bottom:10px}.card h2{font-size:16px;margin:0 0 12px}.metric{font-size:25px;font-weight:800}.muted{color:var(--muted)}.progress{height:8px;background:#29344c;border-radius:99px;overflow:hidden;margin-top:9px}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--accent));border-radius:99px}form{display:grid;gap:9px}input,select,button{font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px;background:#0f172a;color:var(--text)}button{background:var(--accent);color:#06251a;border:0;font-weight:800;cursor:pointer}button.secondary{background:var(--card2);color:var(--text)}button.danger{background:#3a1d29;color:#fecdd3}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.food{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.food:last-child{border-bottom:0}.food strong{display:block}.food small{color:var(--muted)}.actions{display:flex;gap:6px}.actions button{padding:7px 9px;font-size:12px}nav{position:fixed;bottom:0;left:0;right:0;background:#0b1020f7;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px;z-index:10}nav button{background:transparent;color:var(--muted);padding:8px 14px}nav button.active{color:var(--accent);background:#172238}section{display:none}section.active{display:block}.empty{color:var(--muted);padding:12px 0}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header><h1>🥗 Nutrio Premium</h1><div class="sub">Ton suivi nutritionnel, simplement.</div></header><main>
<section id="home" class="active"><div class="card"><h2>Objectif du jour</h2><div class="grid"><div><div class="metric" id="kcal">0</div><div class="muted">kcal / <span id="goalKcal">2700</span></div><div class="progress"><div id="pkcal"></div></div></div><div><div class="metric" id="prot">0 g</div><div class="muted">protéines</div></div><div><div class="metric" id="carb">0 g</div><div class="muted">glucides</div></div><div><div class="metric" id="fat">0 g</div><div class="muted">lipides</div></div></div></div>
<div class="card"><h2>Ajouter un aliment</h2><form id="addForm"><input id="foodName" placeholder="Ex. Petite banane" required><div class="row"><input id="qty" type="number" min="1" value="100" placeholder="Quantité (g)"><select id="meal"><option>Déjeuner</option><option>Dîner</option><option>Collation</option><option>Petit-déjeuner</option></select></div><div class="row"><input id="fKcal" type="number" min="0" placeholder="kcal / 100 g" required><input id="fProt" type="number" min="0" step=".1" placeholder="protéines / 100 g"></div><div class="row"><input id="fCarb" type="number" min="0" step=".1" placeholder="glucides / 100 g"><input id="fFat" type="number" min="0" step=".1" placeholder="lipides / 100 g"></div><button>Ajouter à aujourd'hui</button></form></div>
<div class="card"><h2>Aliments du jour</h2><div id="today"></div></div></section>
<section id="foods"><div class="card"><h2>Base d'aliments</h2><p class="muted">Ajoute tes aliments et utilise des portions personnalisées.</p><form id="foodForm"><input id="dbName" placeholder="Nom de l'aliment" required><div class="row"><input id="dbKcal" type="number" placeholder="kcal / 100 g" required><input id="dbProt" type="number" step=".1" placeholder="prot. / 100 g"></div><div class="row"><input id="dbCarb" type="number" step=".1" placeholder="gluc. / 100 g"><input id="dbFat" type="number" step=".1" placeholder="lip. / 100 g"></div><button>Enregistrer</button></form></div><div class="card"><div id="database"></div></div></section>
<section id="settings"><div class="card"><h2>Objectifs</h2><form id="settingsForm"><input id="goalInput" type="number" min="500" value="2700" placeholder="Calories / jour"><div class="row"><input id="pGoal" type="number" min="0" value="160" placeholder="Protéines (g)"><input id="wGoal" type="number" min="0" step=".1" placeholder="Poids cible (kg)"></div><button>Enregistrer les objectifs</button></form></div><div class="card"><h2>Données</h2><button class="secondary" onclick="exportData()">Exporter mes données</button> <button class="danger" onclick="resetDay()">Effacer la journée</button></div></section>
</main><nav><button class="active" onclick="show('home',this)">🏠 Accueil</button><button onclick="show('foods',this)">🍎 Aliments</button><button onclick="show('settings',this)">⚙️ Réglages</button></nav>
<script>
const KEY='nutrio_v1';let state=JSON.parse(localStorage.getItem(KEY)||'null')||{days:{},foods:[{name:'Petite banane',kcal:89,prot:1.1,carb:22.8,fat:.3},{name:'Poulet blanc',kcal:165,prot:31,carb:0,fat:3.6},{name:'Pâtes cuites',kcal:158,prot:5.8,carb:30.9,fat:.9},{name:'Pomme',kcal:52,prot:.3,carb:13.8,fat:.2},{name:'Œuf',kcal:143,prot:12.6,carb:.7,fat:9.5}],goals:{kcal:2700,prot:160,weight:0}};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function dateKey(){return new Date().toISOString().slice(0,10)}function day(){let k=dateKey();if(!state.days[k])state.days[k]=[];return state.days[k]}function n(v){return Number(v)||0}
function render(){document.getElementById('goalKcal').textContent=state.goals.kcal;const d=day(),t=d.reduce((a,x)=>({kcal:a.kcal+x.kcal,prot:a.prot+x.prot,carb:a.carb+x.carb,fat:a.fat+x.fat}),{kcal:0,prot:0,carb:0,fat:0});document.getElementById('kcal').textContent=Math.round(t.kcal);document.getElementById('prot').textContent=t.prot.toFixed(1)+' g';document.getElementById('carb').textContent=t.carb.toFixed(1)+' g';document.getElementById('fat').textContent=t.fat.toFixed(1)+' g';document.getElementById('pkcal').style.width=Math.min(100,t.kcal/state.goals.kcal*100)+'%';document.getElementById('today').innerHTML=d.length?d.map((x,i)=>`<div class="food"><div><strong>${esc(x.name)}</strong><small>${x.meal} · ${x.qty} g · ${Math.round(x.kcal)} kcal · P ${x.prot.toFixed(1)} g</small></div><div class="actions"><button class="danger" onclick="removeDay(${i})">Suppr.</button></div></div>`).join(''):'<div class="empty">Aucun aliment ajouté aujourd’hui.</div>';document.getElementById('database').innerHTML=state.foods.map((x,i)=>`<div class="food"><div><strong>${esc(x.name)}</strong><small>${x.kcal} kcal · P ${x.prot} g · G ${x.carb} g · L ${x.fat} g / 100 g</small></div><button class="secondary" onclick="useFood(${i})">Utiliser</button></div>`).join('');goalInput.value=state.goals.kcal;pGoal.value=state.goals.prot;wGoal.value=state.goals.weight||''}
function add(e){e.preventDefault();let q=n(qty.value),f=q/100;day().push({name:foodName.value,qty:q,meal:meal.value,kcal:n(fKcal.value)*f,prot:n(fProt.value)*f,carb:n(fCarb.value)*f,fat:n(fFat.value)*f});save();e.target.reset();qty.value=100;render()}function addDb(e){e.preventDefault();state.foods.push({name:dbName.value,kcal:n(dbKcal.value),prot:n(dbProt.value),carb:n(dbCarb.value),fat:n(dbFat.value)});save();e.target.reset();render()}function useFood(i){let x=state.foods[i];show('home',document.querySelector('nav button'));foodName.value=x.name;fKcal.value=x.kcal;fProt.value=x.prot;fCarb.value=x.carb;fFat.value=x.fat;qty.value=100;window.scrollTo({top:0,behavior:'smooth'})}function removeDay(i){day().splice(i,1);save();render()}function resetDay(){if(confirm('Effacer tous les aliments de la journée ?')){state.days[dateKey()]=[];save();render()}}function saveSettings(e){e.preventDefault();state.goals={kcal:n(goalInput.value)||2700,prot:n(pGoal.value)||0,weight:n(wGoal.value)||0};save();render()}function show(id,btn){document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nutrio-donnees.json';a.click();URL.revokeObjectURL(a.href)}addForm.addEventListener('submit',add);foodForm.addEventListener('submit',addDb);settingsForm.addEventListener('submit',saveSettings);render();
</script></body></html>
